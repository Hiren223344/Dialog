name: star_studio
description: >
  Star Studio - a film-production management mini-game. This package
  contains the minimal 2D scaffold (economy, buildings, gigs) plus the
  Tier 1 "juice" feedback layer (reward payouts, like bursts, celebrations).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Embeds the Unity 3D studio scene (unity/) inside Flutter -- only
  # exercised when kUnity3DStudioEnabled is true (see
  # lib/config/feature_flags.dart). This is the Unity-6 line; switch to
  # ^2022.3.0 if your Unity project targets 2019.4-2022.3 instead. See
  # unity/README.md, "Wiring the Flutter bridge".
  flutter_unity_widget_2: ^6000.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
